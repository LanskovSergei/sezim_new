services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sezim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sezim
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sezim"]
      interval: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      SEZIM_DATABASE_URL: postgresql+asyncpg://sezim:${POSTGRES_PASSWORD}@postgres:5432/sezim
      SEZIM_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      SEZIM_DATABASE_URL: postgresql+asyncpg://sezim:${POSTGRES_PASSWORD}@postgres:5432/sezim
      SEZIM_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    network_mode: host
    restart: unless-stopped

volumes:
  pgdata:
