# Минимальная конфигурация LiveKit. TLS терминирует nginx/caddy на video.sez.im → 127.0.0.1:7880.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  devkey: secret-change-me-at-least-32-chars   # совпадает с SEZIM_LIVEKIT_API_KEY / _SECRET
webhook:
  api_key: devkey
  urls:
    - https://sez.im/v1/video/webhook
room:
  empty_timeout: 300
  max_participants: 4
